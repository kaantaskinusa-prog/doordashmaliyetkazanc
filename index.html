function run() {
    // Güvenlik: Boş veya hatalı girilen değerleri sıfıra zorla
    let gel = parseFloat(document.getElementById('h_gelir').value) || 0;
    let hed = parseFloat(document.getElementById('h_hedef').value) || 1;
    let mils = document.getElementsByClassName('h_mil');
    let t_mil = 0;
    
    for(let i=0; i<mils.length; i++) { 
        t_mil += parseFloat(mils[i].value) || 0; 
    }

    // Hesaplamalar
    let yak = (t_mil / 21) * 3.15; 
    let ind = t_mil * 0.67;
    let vrg = Math.max(0, gel - ind) * 0.153;
    let net = gel - (yak + (t_mil * 0.10) + vrg);

    // Görsel Güncelleme (NaN hatasını engellemek için)
    document.getElementById('h_tmil').innerText = t_mil.toFixed(1);
    document.getElementById('h_yakit').innerText = '$' + (isNaN(yak) ? "0.00" : yak.toFixed(2));
    document.getElementById('h_vergi').innerText = '$' + (isNaN(vrg) ? "0.00" : vrg.toFixed(2));
    document.getElementById('h_indirim').innerText = '$' + (isNaN(ind) ? "0.00" : ind.toFixed(2));
    document.getElementById('h_net').innerText = '$' + (isNaN(net) ? "0.00" : net.toFixed(2));
    document.getElementById('h_bar').style.width = Math.min(100, (gel/hed)*100) + '%';
}
