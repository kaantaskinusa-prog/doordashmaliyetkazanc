<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gig Master Pro - Highlander</title>
    <style>
        :root { --main: #FF3008; --bg: #0a0a0a; --card: #1c1c1e; --green: #32d74b; --blue: #0a84ff; --gray: #2c2c2e; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: white; margin: 0; padding: 10px; }
        .box { background: var(--card); border-radius: 15px; padding: 15px; margin-bottom: 10px; border: 1px solid #333; }
        .header { text-align: center; padding: 15px 0; }
        .header h1 { color: var(--main); margin: 0; font-size: 24px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; }
        .header p { color: #8e8e93; font-size: 10px; margin: 4px 0; letter-spacing: 2px; font-weight: bold; }
        label { display: block; font-size: 10px; color: #8e8e93; margin-bottom: 5px; font-weight: 600; text-transform: uppercase; }
        input { width: 100%; padding: 12px; background: var(--gray); border: 1px solid #3a3a3c; color: white; border-radius: 10px; font-size: 16px; box-sizing: border-box; outline: none; margin-bottom: 8px; }
        .progress-bg { background: var(--gray); height: 12px; border-radius: 6px; overflow: hidden; border: 1px solid #3a3a3c; margin-top: 10px; }
        .progress-fill { background: linear-gradient(90deg, #FF3008, #ff6b50); height: 100%; width: 0%; transition: 0.5s ease-in-out; }
        .progress-text { display: flex; justify-content: space-between; font-size: 11px; margin-top: 5px; color: #8e8e93; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .grid-exp { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .m-item { background: var(--gray); padding: 6px 2px; border-radius: 10px; text-align: center; border: 1px solid #3a3a3c; }
        .m-item span { font-size: 9px; color: var(--blue); display: block; margin-bottom: 3px; }
        .m-item input { padding: 5px 2px; font-size: 14px; background: #1c1c1e; border: none; text-align: center; width: 85%; color: white; }
        .row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #2c2c2e; font-size: 14px; }
        .net-res { background: linear-gradient(145deg, #132517, #0a1a0f); padding: 20px; border-radius: 15px; text-align: center; border: 1px solid var(--green); }
        .net-val { font-size: 34px; color: var(--green); font-weight: 900; display: block; }
        .btn { width: 100%; padding: 16px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; font-size: 14px; margin-top: 10px; }
        .btn-save { background: var(--main); color: white; }
        .btn-arch { background: transparent; border: 1px solid var(--green); color: var(--green); }
        .btn-clear { background: transparent; color: #888; font-size: 11px; text-decoration: underline; margin-top: 25px; border: none; cursor: pointer; }
        
        .arch-card { background: #1c1c1e; padding: 12px; border-radius: 12px; margin-top: 10px; border-left: 4px solid var(--green); border-bottom: 1px solid #333; }
        .arch-main { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; }
        .arch-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; font-size: 10px; color: #8e8e93; padding-top: 8px; border-top: 1px solid #2c2c2e; }
        .arch-grid b { color: #ccc; }
        .arch-section-title { font-size: 9px; color: var(--blue); grid-column: span 3; text-transform: uppercase; margin-top: 5px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header"><h1>GIG MASTER PRO</h1><p>UBER • LYFT • DOORDASH</p></div>

    <div class="box">
        <div style="display: flex; gap: 10px;">
            <div style="flex: 1.2;"><label>Ciro / Brüt Gelir ($)</label><input type="number" id="h_gelir" oninput="run()"></div>
            <div style="flex: 0.8;"><label>Hedef</label><input type="number" id="h_hedef" value="1000" oninput="run()"></div>
        </div>
        <div class="progress-bg"><div id="h_bar" class="progress-fill"></div></div>
        <div class="progress-text"><span id="h_yuzde">%0</span><span id="h_kalan">Kalan: $0</span></div>
    </div>

    <div class="box">
        <label>Miller (Haftalık)</label>
        <div class="grid">
            <div class="m-item"><span>PZT</span><input type="number" class="h_mil" oninput="run()"></div>
            <div class="m-item"><span>SAL</span><input type="number" class="h_mil" oninput="run()"></div>
            <div class="m-item"><span>ÇAR</span><input type="number" class="h_mil" oninput="run()"></div>
            <div class="m-item"><span>PER</span><input type="number" class="h_mil" oninput="run()"></div>
            <div class="m-item"><span>CUM</span><input type="number" class="h_mil" oninput="run()"></div>
            <div class="m-item"><span>
